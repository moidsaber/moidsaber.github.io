[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tdasig"
version = "0.1.0"
description = "Topological features of return windows, and tests of whether they carry signal"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "ripser>=0.6.8",
    "arch>=6.0",
]

[tool.setuptools]
packages = ["tdasig"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
